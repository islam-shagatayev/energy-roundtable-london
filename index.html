20a6.5 6.5 0 0 1 13 0\">\u003C/path>\u003Ccircle cx=\"17\" cy=\"9\" r=\"2.5\">\u003C/circle>\u003Cpath d=\"M16 14.2a5 5 0 0 1 5.5 4.8\">\u003C/path>\u003C/svg>\n\u003Cdiv>\u003Cdiv style=\"font-size: 14px; color: #4A6662\">Jointly organised by Unicase Central Asia and AngloKazakh, as part of the British-Kazakh Society’s Kazakhstan Week 2027.\u003C/div>\u003C/div>\n\u003C/div>\n\u003C/div>\n\n\u003Cdiv style=\"padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 16px\">\n\u003Ch2 style=\"margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #4A6662\">DISCUSSION THEMES\u003C/h2>\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n\u003Cdiv style=\"display: flex; gap: 14px\">\u003Cdiv style=\"flex: none; width: 28px; height: 28px; border-radius: 8px; background: #0B2E24; color: #CDEBDD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center\">1\u003C/div>\u003Cdiv>\u003Cdiv style=\"font-size: 15px; font-weight: 600; margin-bottom: 4px\">Beyond the megaprojects\u003C/div>\u003Cdiv style=\"font-size: 14px; line-height: 1.5; color: #3B5753\">Once Kazakhstan's flagship renewable projects reach financial close, what comes next: mid-scale auctions, storage, grid or hybrid projects?\u003C/div>\u003C/div>\u003C/div>\n\u003Cdiv style=\"display: flex; gap: 14px\">\u003Cdiv style=\"flex: none; width: 28px; height: 28px; border-radius: 8px; background: #0B2E24; color: #CDEBDD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center\">2\u003C/div>\u003Cdiv>\u003Cdiv style=\"font-size: 15px; font-weight: 600; margin-bottom: 4px\">Renewables in today's energy mix\u003C/div>\u003Cdiv style=\"font-size: 14px; line-height: 1.5; color: #3B5753\">How can new renewable capacity be integrated into a coal-dependent system, and what does that mean for grid, storage, gas balancing and tariffs?\u003C/div>\u003C/div>\u003C/div>\n\u003Cdiv style=\"display: flex; gap: 14px\">\u003Cdiv style=\"flex: none; width: 28px; height: 28px; border-radius: 8px; background: #0B2E24; color: #CDEBDD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center\">3\u003C/div>\u003Cdiv>\u003Cdiv style=\"font-size: 15px; font-weight: 600; margin-bottom: 4px\">Regional competition for capital\u003C/div>\u003Cdiv style=\"font-size: 14px; line-height: 1.5; color: #3B5753\">With Uzbekistan attracting significant energy investment, how should Kazakhstan position itself: as a competitor, or as part of a complementary regional market?\u003C/div>\u003C/div>\u003C/div>\n\u003Cdiv style=\"display: flex; gap: 14px\">\u003Cdiv style=\"flex: none; width: 28px; height: 28px; border-radius: 8px; background: #0B2E24; color: #CDEBDD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center\">4\u003C/div>\u003Cdiv>\u003Cdiv style=\"font-size: 15px; font-weight: 600; margin-bottom: 4px\">The next generation of investors\u003C/div>\u003Cdiv style=\"font-size: 14px; line-height: 1.5; color: #3B5753\">Who should Kazakhstan be targeting: Gulf and Asian strategics, European and UK DFIs, export credit agencies or institutional capital? And what does each of them need to commit?\u003C/div>\u003C/div>\u003C/div>\n\u003C/div>\n\u003C/div>\n\u003C/div>\n\n\u003Cform sc-camel-on-submit=\"{{ submit }}\" style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; border: 1px solid #DCE8E4; box-shadow: 0 2px 8px rgba(15,59,54,0.06); animation: rtUp .7s cubic-bezier(.22,.61,.36,1) both; animation-delay:.18s\">\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n\u003Ch2 style=\"margin: 0; font-size: 22px; font-weight: 700; color: #0F3B36\">Request to attend\u003C/h2>\n\u003Cp style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #4A6662\">All fields marked * are required.\u003C/p>\n\u003C/div>\n\n\u003Cdiv style=\"display: flex; gap: 12px; background: #FFF6E5; border: 1px solid #F0D9A8; border-radius: 12px; padding: 16px\">\n\u003Csvg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8A5A00\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\">\u003Ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003C/circle>\u003Cpath d=\"M12 8v5M12 16.5v.01\">\u003C/path>\u003C/svg>\n\u003Cdiv style=\"font-size: 14px; line-height: 1.55; color: #4D3800\">\u003Cstrong>This is a closed event with limited seating.\u003C/strong> Submitting this form is a request to attend, not a confirmation. The Organising Committee will review all requests, and confirmed participants will receive a personal calendar invitation. If you do not receive an invitation, the Committee has been unable to accommodate your request on this occasion.\u003C/div>\n\u003C/div>\n\n\u003Cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"fn\" style=\"font-size: 13px; font-weight: 600\">First name *\u003C/label>\u003Cinput id=\"fn\" name=\"firstName\" required=\"\" autocomplete=\"given-name\" style=\"height: 44px; padding: 0 12px; border: 1px solid #C9D8D4; border-radius: 8px; box-sizing: border-box\">\u003C/div>\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"ln\" style=\"font-size: 13px; font-weight: 600\">Last name *\u003C/label>\u003Cinput id=\"ln\" name=\"lastName\" required=\"\" autocomplete=\"family-name\" style=\"height: 44px; padding: 0 12px; border: 1px solid #C9D8D4; border-radius: 8px; box-sizing: border-box\">\u003C/div>\n\u003C/div>\n\n\u003Cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"org\" style=\"font-size: 13px; font-weight: 600\">Organisation *\u003C/label>\u003Cinput id=\"org\" name=\"organisation\" required=\"\" autocomplete=\"organization\" style=\"height: 44px; padding: 0 12px; border: 1px solid #C9D8D4; border-radius: 8px; box-sizing: border-box\">\u003C/div>\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"pos\" style=\"font-size: 13px; font-weight: 600\">Position *\u003C/label>\u003Cinput id=\"pos\" name=\"position\" required=\"\" autocomplete=\"organization-title\" style=\"height: 44px; padding: 0 12px; border: 1px solid #C9D8D4; border-radius: 8px; box-sizing: border-box\">\u003C/div>\n\u003C/div>\n\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"em\" style=\"font-size: 13px; font-weight: 600\">Business email *\u003C/label>\u003Cinput id=\"em\" name=\"email\" type=\"email\" required=\"\" autocomplete=\"email\" style=\"height: 44px; padding: 0 12px; border: 1px solid #C9D8D4; border-radius: 8px; box-sizing: border-box\">\u003Cspan style=\"font-size: 12px; color: #4A6662\">The calendar invitation will be sent to this address if your request is accepted.\u003C/span>\u003C/div>\n\n\u003Cfieldset style=\"margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px\">\n\u003Clegend style=\"font-size: 13px; font-weight: 600; margin-bottom: 10px; padding: 0\">Are you a member of the British-Kazakh Society? *\u003C/legend>\n\u003Cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n\u003Clabel style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid #C9D8D4; border-radius: 8px; font-size: 14px; cursor: pointer\">\u003Cinput type=\"radio\" name=\"bks\" value=\"yes\" required=\"\" style=\"accent-color: #1F6F63; width: 18px; height: 18px; margin: 0\">Yes, I am a BKS member\u003C/label>\n\u003Clabel style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid #C9D8D4; border-radius: 8px; font-size: 14px; cursor: pointer\">\u003Cinput type=\"radio\" name=\"bks\" value=\"no\" style=\"accent-color: #1F6F63; width: 18px; height: 18px; margin: 0\">No\u003C/label>\n\u003C/div>\n\u003C/fieldset>\n\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"ind\" style=\"font-size: 13px; font-weight: 600\">Industry *\u003C/label>\n\u003Csc-raw-select id=\"ind\" name=\"industry\" required=\"\" style=\"height: 44px; padding: 0 12px; border: 1px solid #C9D8D4; border-radius: 8px; background: #FFFFFF; box-sizing: border-box\">\n\u003Coption value=\"\">Select your industry\u003C/option>\n\u003Coption>Oil and gas\u003C/option>\n\u003Coption>Power and renewables\u003C/option>\n\u003Coption>Grid, storage and utilities\u003C/option>\n\u003Coption>Mining and critical minerals\u003C/option>\n\u003Coption>Banking, DFIs and export credit\u003C/option>\n\u003Coption>Private equity and institutional investment\u003C/option>\n\u003Coption>Government and public sector\u003C/option>\n\u003Coption>Legal and advisory\u003C/option>\n\u003Coption>Other\u003C/option>\n\u003C/sc-raw-select>\u003C/div>\n\n\u003Cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\u003Clabel for=\"why\" style=\"font-size: 13px; font-weight: 600\">Why would you like to take part in this roundtable? *\u003C/label>\n\u003Ctextarea id=\"why\" name=\"motivation\" required=\"\" rows=\"5\" placeholder=\"Briefly describe your interest in Kazakhstan's energy sector and the perspective you would bring to the discussion.\" style=\"padding: 12px; border: 1px solid #C9D8D4; border-radius: 8px; resize: vertical; line-height: 1.5; box-sizing: border-box\">\u003C/textarea>\u003C/div>\n\n\u003Clabel style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #3B5753; cursor: pointer\">\u003Cinput type=\"checkbox\" required=\"\" style=\"accent-color: #1F6F63; width: 18px; height: 18px; margin: 1px 0 0; flex: none\">I agree that my details will be shared with the Organising Committee for the purpose of reviewing my request and organising this event. *\u003C/label>\n\n\u003Cbutton type=\"submit\" style=\"height: 48px; border: 0; border-radius: 999px; background: #0B2E24; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">Submit request\u003C/button>\n\u003C/form>\n\n\u003C/div>\n\u003C/sc-if>\n\n\u003Csc-if value=\"{{ showDone }}\" hint-placeholder-val=\"{{ false }}\">\n\u003Cdiv style=\"max-width: 640px; margin: 24px auto 0; background: #FFFFFF; border-radius: 16px; padding: 48px 40px; border: 1px solid #DCE8E4; box-shadow: 0 2px 8px rgba(15,59,54,0.06); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center\">\n\u003Cdiv style=\"width: 56px; height: 56px; border-radius: 999px; background: #CDEBDD; display: flex; align-items: center; justify-content: center\">\u003Csvg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F3B36\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003Cpath d=\"M5 12.5l4.5 4.5L19 7.5\">\u003C/path>\u003C/svg>\u003C/div>\n\u003Ch2 style=\"margin: 0; font-size: 24px; font-weight: 700; color: #0F3B36\">Thank you, your request has been received\u003C/h2>\n\u003Cp style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3B5753\">The Organising Committee will review all requests. As places are very limited, confirmed attendees will receive a personal calendar invitation by [DATE].\u003C/p>\n\u003Cp style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3B5753\">If you do not receive an invitation, the Committee has been unable to accommodate your request on this occasion. We appreciate your interest and hope to welcome you at a future Unicase event.\u003C/p>\n\u003Cp style=\"margin: 8px 0 0; font-size: 14px; color: #4A6662\">Questions: \u003Ca href=\"mailto:marketing@unicaselaw.com\">marketing@unicaselaw.com\u003C/a>\u003C/p>\n\u003Cbutton type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"margin-top: 8px; height: 44px; padding: 0 20px; border: 1px solid #C9D8D4; border-radius: 999px; background: #FFFFFF; color: #0F3B36; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Back to event details\u003C/button>\n\u003C/div>\n\u003C/sc-if>\n\n\u003Cdiv style=\"position: relative; margin-top: 8px; height: 300px; border-radius: 20px; overflow: hidden; background: #DCE8E4\">\n\u003Cimg src=\"7eccae99-c5e2-49d5-9379-3f28f6ad3ea2\" alt=\"Power grid, nuclear, solar and wind generation set against mountains\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 70%; animation: rtKen 20s ease-in-out both; display: block\">\n\u003Cdiv style=\"position: absolute; inset: 0; background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.55) 22%, rgba(255,255,255,0) 48%, rgba(11,46,36,0) 58%, rgba(11,46,36,0.82) 100%)\">\u003C/div>\n\u003Cdiv style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px\">\n\u003Cdiv style=\"font-size: 20px; font-weight: 700; line-height: 1.25; color: #FFFFFF; max-width: 520px\">Kazakhstan’s Energy Transition: The Next Wave of Investment\u003C/div>\n\u003Cdiv style=\"font-size: 13px; line-height: 1.5; color: #CDEBDD\">London · 25 January 2027 · Closed-door roundtable\u003C/div>\n\u003C/div>\n\u003C/div>\n\u003C/div>\n\u003C/div>\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1800}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { done: false }; }\n  renderVals() {\n    const done = this.state.done;\n    return {\n      showForm: !done,\n      showDone: done,\n      submit: (e) => { e.preventDefault(); this.setState({ done: true }); },\n      reset: () => this.setState({ done: false })\n    };\n  }\n}\n\u003C/script>\n\n\n\u003C/body>\u003C/html>"</script>
